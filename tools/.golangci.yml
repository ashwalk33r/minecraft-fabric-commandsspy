# Strict on purpose (no exclusion presets): protocol/network code, where an
# ignored error is a silent failure. Lineage: ubuntu/power-state-control.
version: "2"
linters:
  enable:
    - misspell
  exclusions:
    rules:
      - linters:
          - errcheck
        path: _test\.go
run:
  timeout: 3m
