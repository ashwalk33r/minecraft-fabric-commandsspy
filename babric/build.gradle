// Minecraft Beta 1.7.3, the only version Babric exists for. Built against the ORNITHE
// toolchain (live) and reverse-converted to a BABRIC artifact (what users install):
// Babric's own loader fork froze 2024-02-08 and its barn mappings 2023-01-25, with the
// server command classes left unmapped, so building against barn is not an option.
// Evidence and the exact resolved coordinates: docs/babric-toolchain-spike.md.
plugins {
	id 'java'
	// Resolved by the spike. Note the ploceus plugin id is the BARE `ploceus`, not
	// `net.ornithemc.ploceus`, and it is a SNAPSHOT -- the only version line Ornithe
	// publishes for the Loom 1.15 series, and what RetroCommands itself uses. A
	// snapshot can change under a later build with no version bump; that
	// reproducibility gap is recorded, not engineered around.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_remap_version_babric}"
	id 'ploceus' version "${ploceus_version_babric}"
	// Reverse-converts the Ornithe artifact to a Babric one. Registers `babricJar`.
	id 'com.periut.retroconvert' version "${retroconvert_version_babric}"
}

// Root .env.version stays the single MOD_VERSION source for every loader.
def envVersionProps = new Properties()
file("${rootDir}/../.env.version").withInputStream { envVersionProps.load(it) }
def modVersion = envVersionProps.getProperty('MOD_VERSION')
if (modVersion == null || modVersion.isBlank()) {
	throw new GradleException("MOD_VERSION not found or empty in ../.env.version")
}

// One row per value, read once from gradle.properties -- adding or changing a pin is
// an edit in that file, not a scavenger hunt through this one.
def minecraftVersion = project.minecraft_version_babric
def minecraftRange = project.minecraft_range_babric
def loaderVersion = project.loader_version_babric
def loaderRange = project.loader_range_babric
def javaRange = project.java_range_babric
def mixinCompat = project.mixin_compat_babric
def mappingsVersion = project.mappings_version_babric
def intermediaryGen = project.intermediary_generation_babric as int

// Filename carries b1.7.3 rather than an era band: there is no band, and it matches
// Babric's own Gradle/Modrinth version string. retroconvert's `babricJar` task appends
// the `-babric` classifier itself (the spike's probe emitted
// `babricprobe-0.0.1-babric.jar`), so this version string must NOT repeat it -- the two
// compose into commandsspy-<ver>+mcb1.7.3-babric.jar, which is the shipped name.
version = "${modVersion}+mcb1.7.3"
group = 'm2x.commandsspy'
base.archivesName = 'commandsspy'

repositories {
	maven {
		name = 'Ornithe'
		url = 'https://maven.ornithemc.net/releases'
	}
	maven {
		name = 'GlassLauncher'
		url = 'https://maven.glass-launcher.net/releases'
	}
	maven {
		name = 'Babric'
		url = 'https://maven.glass-launcher.net/babric'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

// The shared, loader-agnostic core -- source-included, exactly as forge/ and neoforge/
// do it, so all five loaders compile the same copy of CommandsSpy.java and there is no
// second implementation to drift.
sourceSets.main.java.srcDir("${rootDir}/../src/main/java")

// Calamus gen2 is the intermediary generation Ornithe serves for b1.7.3; biny-ornithe
// is the named mapping set over it. barn is deliberately NOT used -- its server command
// classes are unmapped, which is the whole reason this build is Ornithe-based.
ploceus {
	setIntermediaryGeneration(intermediaryGen)
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	// ploceus.mappings(), not a bare `mappings "..."`: the layered Calamus/biny setup is
	// assembled by the plugin. Same call RetroCommands makes.
	mappings(ploceus.mappings("net.glasslauncher:biny-ornithe:${mappingsVersion}:mergedv2"))
	modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"

	// No Fabric API, no OSL, no RetroCommands. The mod consumes no loader-exclusive API
	// on any platform, and Babric is not where that changes -- the two mixins below hook
	// vanilla seams directly. MixinExtras 0.5.4 arrives bundled inside the loader (the
	// spike saw it in the mod list), so it is not declared here either.

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.3"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
	// Gradle 9 no longer puts the launcher on the test runtime classpath itself. The root
	// build gets it transitively via fabric-loader-junit; this build has no such dependency,
	// so it is declared.
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.3"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_range", minecraftRange
	inputs.property "loader_range", loaderRange
	inputs.property "java_range", javaRange
	inputs.property "mixin_compat", mixinCompat

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_range": minecraftRange,
				"loader_range": loaderRange, "java_range": javaRange
	}

	filesMatching("commandsspy-babric.mixins.json") {
		expand "mixin_compat": mixinCompat
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// 21, not the era-contemporary 8: the game's floor is 8 but the loader stack's is
	// higher, and the higher floor is the one that can actually fail to load. See the
	// spec's D5.
	it.options.release = 21
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	def archivesName = project.base.archivesName.get()
	from("${rootDir}/../LICENSE") {
		rename { "${it}_${archivesName}" }
	}
}

// The SHIPPED artifact is the reverse-converted one, so `build` must produce it: without
// this, `gradle -p babric build` stops at Loom's Calamus-namespaced remapJar and the jar
// the e2e leg installs would never be generated.
tasks.named('build') {
	dependsOn tasks.named('babricJar')
}
