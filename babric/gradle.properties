# Babric target — Minecraft Beta 1.7.3, the only version Babric exists for.
# Built against the Ornithe toolchain and reverse-converted to a Babric artifact:
# Babric's own loader fork froze at 0.15.6-babric.2 (2024-02-08) and its barn
# mappings at 2023-01-25, with the server command classes left unmapped. See
# docs/babric-toolchain-spike.md for what was actually resolved and booted.
minecraft_version_babric=b1.7.3

# Exactly this version, never a range: Babric is b1.7.3 and nothing else, so a
# range predicate over a one-element set would be a lie with extra syntax.
# The semver-ized form is what fabric.mod.json's dependency parser reads, and is
# what the loader printed back as `minecraft 1.0.0-beta.7.3` when the spike's
# probe mod loaded.
minecraft_range_babric=1.0.0-beta.7.3

# Upstream fabric-loader, NOT the frozen babric fork. This is what
# meta.babric.glass-launcher.net/v2/versions/loader serves and what the Babric
# installer actually puts in libraries/. Verified booting in the spike.
loader_version_babric=0.19.3
loader_range_babric=>=0.19.3

# Java 21, not the era-contemporary 8. The game imposes 8; the loader stack
# imposes higher (loader needs 17+, Loom needs 21 to build at all), and the
# higher floor is the one that can actually fail to load. RetroCommands ships
# JAVA_21 bytecode running on b1.7.3 in production. Declared as the single JVM
# the e2e leg boots — no forward-JVM rows for a frozen platform.
java_range_babric=21
mixin_compat_babric=JAVA_21

# Named mappings, resolved from maven.glass-launcher.net/releases. This is the
# LATEST published build, not the bdae1bc that RetroCommands 0.7.5 pins; the
# spike resolved and built against 57cc158 directly. Both command seams are
# named here, which is the entire reason this build is Ornithe-based rather
# than barn-based.
mappings_version_babric=b1.7.3+build.57cc158

# The three build plugins, pinned to what the spike actually resolved. Note the
# ploceus plugin id is the bare `ploceus`, not `net.ornithemc.ploceus`, and it
# is a SNAPSHOT — the only version line Ornithe publishes for the Loom 1.15
# series. Its resolved build was 1.15.9, and Loom's 1.15.+ resolved to 1.15.5.
loom_remap_version_babric=1.15.+
ploceus_version_babric=1.15-SNAPSHOT

# retroconvert performs the Ornithe->Babric reverse conversion. It is published
# on the author's own GitHub-Pages maven (https://matthewperiut.github.io/repository),
# NOT on maven.glass-launcher.net. It registers the `babricJar` task.
retroconvert_version_babric=1.0.0

# Calamus intermediary generation. gen2 is what Ornithe serves for b1.7.3 and is
# the generation biny-ornithe is written over.
intermediary_generation_babric=2
