name: 'Java Gradle Setup'
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
    - uses: gradle/actions/wrapper-validation@v4
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: false
    - run: chmod +x ./gradlew
      shell: bash
