# Wiki links and anchors: its own workflow, not a job in ci.yml, because it
# wants a daily `schedule:` and ci.yml's top-level `on:` would fire the entire
# pipeline — every build and the whole e2e grid — once a day.
#
# CAVEAT, write this down or the cron gets mistaken for a guarantee: GitHub
# DISABLES scheduled workflows after 60 days of repository inactivity, so the
# cron can silently stop being a cron. This repo already refused a `schedule:`
# as a correctness gate for that reason, when #59 considered one for the deep
# sweep. It is acceptable here only because the cron is EARLY WARNING; the gate
# is carried by the pull_request and push triggers, which cannot be disabled by
# inactivity. If the cron is ever the only thing standing between a broken
# citation and main, this argument has stopped applying.
#
# Every `.../wiki/<Page>#anchor` in the tree, and every link between wiki
# pages, resolved against a live clone of the wiki — the mechanism that
# replaces hand-verifying anchors.
#
# Its OWN job on purpose, not a step in `contracts` and not in `make ci`.
# This one clones the wiki, so it is a network job; `contracts` makes no
# network call by design and that is load-bearing — it is why gen_matrix.go's
# "no Forge build published" exclusions carry a reason prefix that
# test-jar-routing.sh skips rather than re-probe. Putting a clone inside
# `contracts` would quietly retire that property. `make ci` is dockerized and
# offline for the same reason. The SCRIPT stays offline-runnable via
# WIKI_DIR=<path>; the network belongs to this job, not to the script.
#
# fetch-depth: 0 is load-bearing — the provenance check asks whether the shas
# Supported-Versions cites are ancestors of origin/main.
name: Wiki links

on:
  pull_request:
  push:
    branches: [ "main" ]
  schedule:
    # Daily, off the hour: wiki drift surfaces on its own run instead of
    # ambushing whoever happens to be merging.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: wiki-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki-links:
    name: "Wiki links: every page and anchor resolves"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: "Assert every wiki link and anchor resolves"
        run: scripts/test-wiki-links.sh
