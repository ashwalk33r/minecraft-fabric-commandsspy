# End-to-end Docker tests: boot a real Fabric server per {Minecraft, Java} pair.
# A band whose list is '[]' skips its stage jobs at zero cost.
# See docs/ci.md.
name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make test` runs all four targets inside the pinned Dockerfile.ci image —
  # no runner-installed JDK needed for any target, including the 26.x one.
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Test: unit tests (all four Minecraft targets)"
        run: make test

  build-jars:
    name: "Build jars for e2e"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      mc121_java21: ${{ steps.grid.outputs.mc121_java21 }}
      mc121_java25: ${{ steps.grid.outputs.mc121_java25 }}
      mc121_java26: ${{ steps.grid.outputs.mc121_java26 }}
      mc26_java25: ${{ steps.grid.outputs.mc26_java25 }}
      mc26_java26: ${{ steps.grid.outputs.mc26_java26 }}
      t0_java21: ${{ steps.grid.outputs.t0_java21 }}
      t0_java25: ${{ steps.grid.outputs.t0_java25 }}
      t0_java26: ${{ steps.grid.outputs.t0_java26 }}
      mc1192_java17: ${{ steps.grid.outputs.mc1192_java17 }}
      mc1192_java21: ${{ steps.grid.outputs.mc1192_java21 }}
      mc114_java8: ${{ steps.grid.outputs.mc114_java8 }}
      mc114_java17: ${{ steps.grid.outputs.mc114_java17 }}
      mc114_java21: ${{ steps.grid.outputs.mc114_java21 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Verify action pins"
        run: scripts/verify-action-pins.sh
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      # Same cache the go-tools job (gradle.yml) keeps warm: ci-tools-test/
      # ci-gen-matrix compile tools/ from scratch without it (measured: ~51s
      # cold vs ~4.6s warm combined for these two steps).
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-go
          key: ci-go-${{ hashFiles('Dockerfile.ci', 'tools/go.mod') }}
      - name: "Assert the e2e grid contract"
        run: make ci-tools-test
      # Probes the real version->jar routing paths so cross-file drift fails here, not in a boot.
      - name: "Assert the version->jar routing contract"
        run: scripts/test-jar-routing.sh
      - name: "Build: mod compilation (all six jars: four Fabric/Quilt eras + two NeoForge lines)"
        run: make build
      - name: "Build: upload the mod artifact (Minecraft 1.21.x target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.21.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.21.x.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (Minecraft 1.19-1.20.2 target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.19-1.20.2-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.19-1.20.2.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (Minecraft 1.14-1.18 target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.14.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.14.x.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (Minecraft 26.x target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc26.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc26.x.jar
          if-no-files-found: error
          retention-days: 1
      # Separate step and separate Gradle build (forge/), on purpose: ForgeGradle
      # never touches the four shipping jars above. First build decompiles
      # Minecraft, so it is slow when the ci-gradle cache misses.
      - name: "Build: mod compilation (Forge target, Minecraft 1.20.6-1.21.5)"
        run: make build-forge
      - name: "Build: upload the mod artifact (Forge target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-forge-${{ github.sha }}
          path: forge/build/libs/commandsspy-*+mc1.21.x-forge.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (NeoForge 21.1, Minecraft 1.21.1)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-neoforge-mc1.21.1-${{ github.sha }}
          path: build/libs/commandsspy-*+neoforge-mc1.21.1.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (NeoForge 26.2, Minecraft 26.2)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-neoforge-mc26.2-${{ github.sha }}
          path: build/libs/commandsspy-*+neoforge-mc26.2.jar
          if-no-files-found: error
          retention-days: 1

      # THE single source of stage definitions. Lean grid on pull_request,
      # full cross-product on workflow_dispatch; absent bands emit [].
      - name: "Compute the gated version lists for this trigger"
        id: grid
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: make ci-gen-matrix

  # Stage 1. Two canary pairs — the newest version of each Minecraft line on its
  # floor JVM — run before the wide fan-out, so a broken build costs 2 jobs.
  e2e-gate:
    name: "e2e-gate (${{ matrix.mc }}, java ${{ matrix.java }}, ${{ matrix.loader }})"
    needs: [build-jars, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      # fail-fast off: all four canaries must report.
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", java: "21", loader: "fabric" }
          - { mc: "1.21.11", java: "21", loader: "quilt" }
          - { mc: "26.2", java: "25", loader: "fabric" }
          - { mc: "26.2", java: "25", loader: "quilt" }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: "Download prebuilt jars (all Minecraft targets)"
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: commandsspy-jar-*-${{ github.sha }}
          merge-multiple: true
          path: build/libs
      - name: "Verify prebuilt jars are in place"
        run: |
          ls -l build/libs
          test -f build/libs/commandsspy-*+mc1.21.x.jar
          test -f build/libs/commandsspy-*+mc1.19-1.20.2.jar
          test -f build/libs/commandsspy-*+mc1.14.x.jar
          test -f build/libs/commandsspy-*+mc26.x.jar
          test -f build/libs/commandsspy-*+neoforge-mc1.21.1.jar
          test -f build/libs/commandsspy-*+neoforge-mc26.2.jar
      # Keyed by MC version + loader: see the matching step in e2e-stage.yml.
      - name: "Restore the server launcher jar cache"
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-e2e-jars
          key: e2e-jar-${{ matrix.mc }}-${{ matrix.loader }}
      - name: "E2E: Minecraft ${{ matrix.mc }} on Java ${{ matrix.java }} (${{ matrix.loader }})"
        run: make e2e-ci VERSIONS="${{ matrix.mc }}" JAVA="${{ matrix.java }}" LOADER="${{ matrix.loader }}" PARALLEL=1
      - name: "Upload e2e logs (Minecraft ${{ matrix.mc }}, Java ${{ matrix.java }}, ${{ matrix.loader }})"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs-mc${{ matrix.mc }}-java${{ matrix.java }}-${{ matrix.loader }}-${{ github.sha }}
          path: |
            build/e2e-logs/
            build/e2e-results/
          if-no-files-found: warn
          retention-days: 7

  # NeoForge — deliberately NOT part of e2e-gate. The gate exists to stop a
  # broken build before the ~40-job Fabric/Quilt fan-out; a NeoForge break is
  # not a reason to withhold that coverage, so NeoForge runs alongside the gate
  # instead of in front of it. Each of the two runs is its own job group for
  # the same Actions-UI reason the Quilt variants are (see the stage comment
  # below): separate, independently-collapsible groups.
  #
  # `versions:` is a literal list, not a build-jars output: NeoForge has no
  # Intermediary-equivalent stable mapping, so one jar covers exactly one
  # Minecraft version and the whole loader is two versions wide. Generating
  # a two-element list would buy nothing — tools/gen_matrix.go stays untouched.
  # The `if:` therefore also drops the `!= '[]'` clause the generated bands
  # need: a literal list is never empty.
  e2e-neoforge-mc1211-java21:
    name: "e2e 1.21.1 java 21 (neoforge)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.21.1"]'
      java: "21"
      loader: "neoforge"
      jar-sha: ${{ github.sha }}

  e2e-neoforge-mc262-java25:
    name: "e2e 26.2 java 25 (neoforge)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["26.2"]'
      java: "25"
      loader: "neoforge"
      jar-sha: ${{ github.sha }}

  # Stage 2 — current mainstream (1.21.x, 26.x). The `if:` used on every stage job:
  # !cancelled() lets an upstream SKIP pass through, !contains(...'failure') still
  # stops on a real failure, and != '[]' skips an empty band (GitHub errors on a
  # [] matrix). Full explanation in docs/ci.md.
  #
  # Every band below runs as two separate job groups, one per loader
  # (fabric/quilt), in parallel — not one group with loader mixed into its
  # matrix rows — purely so the Actions UI shows two clearly separate,
  # independently-collapsible groups instead of interleaved rows in one
  # shared group. Stage ordering (popularity-first) is unaffected: each
  # band's `needs:` lists both loader variants of every prior band.
  e2e-mc121-java21-fabric:
    name: "e2e 1.21.x java 21 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java21 }}
      java: "21"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java21-quilt:
    name: "e2e 1.21.x java 21 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java21 }}
      java: "21"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  # Forge: THREE legs, hand-listed rather than driven by tools/gen_matrix.go
  # (still loader-unaware — see issue #23's Phase 2). 1.20.6 and 1.21.5 are the
  # measured floor and ceiling of the single Forge jar's Minecraft range;
  # 1.20.4 is a GUARD leg that asserts Forge refuses the mod below the floor,
  # where its official-name Minecraft calls would crash the server mid-command.
  # No middle versions: the mapping regime and EventBus generation are uniform
  # across the range, so nothing can fail in the middle while both edges pass.
  e2e-forge-java21:
    name: "e2e 1.20.6-1.21.5 java 21 (forge)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.20.4","1.20.6","1.21.5"]'
      java: "21"
      loader: "forge"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java25-fabric:
    name: "e2e 1.21.x java 25 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java25 }}
      java: "25"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java25-quilt:
    name: "e2e 1.21.x java 25 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java25 }}
      java: "25"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java26-fabric:
    name: "e2e 1.21.x java 26 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java26 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java26 }}
      java: "26"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java26-quilt:
    name: "e2e 1.21.x java 26 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java26 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java26 }}
      java: "26"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java25-fabric:
    name: "e2e 26.x java 25 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc26_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc26_java25 }}
      java: "25"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java25-quilt:
    name: "e2e 26.x java 25 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc26_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc26_java25 }}
      java: "25"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java26-fabric:
    name: "e2e 26.x java 26 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc26_java26 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc26_java26 }}
      java: "26"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java26-quilt:
    name: "e2e 26.x java 26 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc26_java26 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc26_java26 }}
      java: "26"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-t0-java21-fabric:
    name: "e2e 1.20.3-1.20.6 java 21 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21-fabric, e2e-mc121-java21-quilt,
            e2e-mc121-java25-fabric, e2e-mc121-java25-quilt,
            e2e-mc121-java26-fabric, e2e-mc121-java26-quilt,
            e2e-mc26-java25-fabric, e2e-mc26-java25-quilt,
            e2e-mc26-java26-fabric, e2e-mc26-java26-quilt]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java21 }}
      java: "21"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-t0-java21-quilt:
    name: "e2e 1.20.3-1.20.6 java 21 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21-fabric, e2e-mc121-java21-quilt,
            e2e-mc121-java25-fabric, e2e-mc121-java25-quilt,
            e2e-mc121-java26-fabric, e2e-mc121-java26-quilt,
            e2e-mc26-java25-fabric, e2e-mc26-java25-quilt,
            e2e-mc26-java26-fabric, e2e-mc26-java26-quilt]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java21 }}
      java: "21"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-t0-java25-fabric:
    name: "e2e 1.20.3-1.20.6 java 25 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21-fabric, e2e-mc121-java21-quilt,
            e2e-mc121-java25-fabric, e2e-mc121-java25-quilt,
            e2e-mc121-java26-fabric, e2e-mc121-java26-quilt,
            e2e-mc26-java25-fabric, e2e-mc26-java25-quilt,
            e2e-mc26-java26-fabric, e2e-mc26-java26-quilt]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java25 }}
      java: "25"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-t0-java25-quilt:
    name: "e2e 1.20.3-1.20.6 java 25 (quilt)"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21-fabric, e2e-mc121-java21-quilt,
            e2e-mc121-java25-fabric, e2e-mc121-java25-quilt,
            e2e-mc121-java26-fabric, e2e-mc121-java26-quilt,
            e2e-mc26-java25-fabric, e2e-mc26-java25-quilt,
            e2e-mc26-java26-fabric, e2e-mc26-java26-quilt]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java25 }}
      java: "25"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-t0-java26-fabric:
    name: "e2e 1.20.3-1.20.6 java 26 (fabric)"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21-fabric, e2e-mc121-java21-quilt,
            e2e-mc121-java25-fabric, e2e-mc121-java25-quilt,
            e2e-mc121-java26-fabric, e2e-mc121-java26-quilt,
            e2e-mc26-java25-fabric, e2e-mc26-java25-quilt,
            e2e-mc26-java26-fabric, e2e-mc26-java26-quilt]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java26 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java26 }}
      java: "26"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

