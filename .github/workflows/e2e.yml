# End-to-end Docker tests: boot a real Fabric server per {Minecraft, Java} pair.
# Stages run in popularity order and chain via `needs:`, so the mainstream reports first.
# A band whose list is '[]' skips its stage jobs at zero cost.
# Stage data lives in tools/gen_matrix.go; the job body lives once in e2e-stage.yml.
# See docs/ci.md.
name: E2E

on:
  pull_request:
  workflow_dispatch:

# A new push supersedes the in-flight sweep.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make test` runs all four targets inside the pinned Dockerfile.ci image —
  # no runner-installed JDK needed for any target, including the 26.x one.
  unit-tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: "Test: unit tests (all four Minecraft targets)"
        run: make test

  build-jars:
    name: "Build jars for e2e"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      mc121_java21: ${{ steps.grid.outputs.mc121_java21 }}
      mc121_java25: ${{ steps.grid.outputs.mc121_java25 }}
      mc121_java26: ${{ steps.grid.outputs.mc121_java26 }}
      mc26_java25: ${{ steps.grid.outputs.mc26_java25 }}
      mc26_java26: ${{ steps.grid.outputs.mc26_java26 }}
      t0_java21: ${{ steps.grid.outputs.t0_java21 }}
      t0_java25: ${{ steps.grid.outputs.t0_java25 }}
      t0_java26: ${{ steps.grid.outputs.t0_java26 }}
      mc1192_java17: ${{ steps.grid.outputs.mc1192_java17 }}
      mc1192_java21: ${{ steps.grid.outputs.mc1192_java21 }}
      mc114_java8: ${{ steps.grid.outputs.mc114_java8 }}
      mc114_java17: ${{ steps.grid.outputs.mc114_java17 }}
      mc114_java21: ${{ steps.grid.outputs.mc114_java21 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Verify action pins"
        run: scripts/verify-action-pins.sh
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      # Machine-asserts the per-stage and total job counts offline, before anything is built.
      - name: "Assert the e2e grid contract"
        run: make ci-tools-test
      # Probes the real version->jar routing paths so cross-file drift fails here, not in a boot.
      - name: "Assert the version->jar routing contract"
        run: scripts/test-jar-routing.sh
      - name: "Build: mod compilation (all four Minecraft targets)"
        run: make build
      - name: "Build: upload the mod artifact (Minecraft 1.21.x target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.21.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.21.x.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (Minecraft 1.19-1.20.2 target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.19-1.20.2-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.19-1.20.2.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (Minecraft 1.14-1.18 target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.14.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.14.x.jar
          if-no-files-found: error
          retention-days: 1
      - name: "Build: upload the mod artifact (Minecraft 26.x target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc26.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc26.x.jar
          if-no-files-found: error
          retention-days: 1

      # THE single source of stage definitions. Lean grid on pull_request,
      # full cross-product on workflow_dispatch; absent bands emit [].
      - name: "Compute the gated version lists for this trigger"
        id: grid
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: make ci-gen-matrix

  # Stage 1. Two canary pairs — the newest version of each Minecraft line on its
  # floor JVM — run before the wide fan-out, so a broken build costs 2 jobs.
  e2e-gate:
    name: "e2e-gate (${{ matrix.mc }}, java ${{ matrix.java }})"
    needs: [build-jars, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      # fail-fast off: both canaries must report.
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", java: "21" }
          - { mc: "26.2", java: "25" }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Download prebuilt jars (all Minecraft targets)"
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: commandsspy-jar-*-${{ github.sha }}
          merge-multiple: true
          path: build/libs
      - name: "Verify prebuilt jars are in place"
        run: |
          ls -l build/libs
          test -f build/libs/commandsspy-*+mc1.21.x.jar
          test -f build/libs/commandsspy-*+mc1.19-1.20.2.jar
          test -f build/libs/commandsspy-*+mc1.14.x.jar
          test -f build/libs/commandsspy-*+mc26.x.jar
      # Keyed by MC version only: see the matching step in e2e-stage.yml.
      - name: "Restore the Fabric server launcher jar cache"
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-e2e-jars
          key: e2e-jar-${{ matrix.mc }}
      - name: "E2E: Minecraft ${{ matrix.mc }} on Java ${{ matrix.java }}"
        run: make e2e-ci VERSIONS="${{ matrix.mc }}" JAVA="${{ matrix.java }}" PARALLEL=1
      - name: "Upload e2e logs (Minecraft ${{ matrix.mc }}, Java ${{ matrix.java }})"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs-mc${{ matrix.mc }}-java${{ matrix.java }}-${{ github.sha }}
          path: |
            build/e2e-logs/
            build/e2e-results/
          if-no-files-found: warn
          retention-days: 7

  # Stage 2 — current mainstream (1.21.x, 26.x). The `if:` used on every stage job:
  # !cancelled() lets an upstream SKIP pass through, !contains(...'failure') still
  # stops on a real failure, and != '[]' skips an empty band (GitHub errors on a
  # [] matrix). Full explanation in docs/ci.md.
  e2e-mc121-java21:
    name: "e2e 1.21.x java 21"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java21 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java21 }}
      java: "21"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java25:
    name: "e2e 1.21.x java 25"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java25 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java25 }}
      java: "25"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java26:
    name: "e2e 1.21.x java 26"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc121_java26 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc121_java26 }}
      java: "26"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java25:
    name: "e2e 26.x java 25"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc26_java25 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc26_java25 }}
      java: "25"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java26:
    name: "e2e 26.x java 26"
    needs: [build-jars, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc26_java26 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc26_java26 }}
      java: "26"
      jar-sha: ${{ github.sha }}

  # Stage 3 — T0 band: 1.20.3-1.20.6, floor java 21.
  e2e-t0-java21:
    name: "e2e 1.20.3-1.20.6 java 21"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java21 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java21 }}
      java: "21"
      jar-sha: ${{ github.sha }}

  e2e-t0-java25:
    name: "e2e 1.20.3-1.20.6 java 25"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java25 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java25 }}
      java: "25"
      jar-sha: ${{ github.sha }}

  e2e-t0-java26:
    name: "e2e 1.20.3-1.20.6 java 26"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.t0_java26 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.t0_java26 }}
      java: "26"
      jar-sha: ${{ github.sha }}

  # Stage 4 — mc1192 band: 1.19-1.20.2, floor java 17.
  e2e-mc1192-java17:
    name: "e2e 1.19-1.20.2 java 17"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26,
            e2e-t0-java21, e2e-t0-java25, e2e-t0-java26]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc1192_java17 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc1192_java17 }}
      java: "17"
      jar-sha: ${{ github.sha }}

  e2e-mc1192-java21:
    name: "e2e 1.19-1.20.2 java 21"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26,
            e2e-t0-java21, e2e-t0-java25, e2e-t0-java26]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc1192_java21 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc1192_java21 }}
      java: "21"
      jar-sha: ${{ github.sha }}

  # Stage 5 — mc114 band: 1.14-1.18, split floors (1.14-1.16.x java 8, 1.17-1.18 java 17).
  e2e-mc114-java8:
    name: "e2e 1.14-1.16 java 8"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26,
            e2e-t0-java21, e2e-t0-java25, e2e-t0-java26,
            e2e-mc1192-java17, e2e-mc1192-java21]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc114_java8 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc114_java8 }}
      java: "8"
      jar-sha: ${{ github.sha }}

  e2e-mc114-java17:
    name: "e2e 1.17-1.18 java 17"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26,
            e2e-t0-java21, e2e-t0-java25, e2e-t0-java26,
            e2e-mc1192-java17, e2e-mc1192-java21]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc114_java17 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc114_java17 }}
      java: "17"
      jar-sha: ${{ github.sha }}

  e2e-mc114-java21:
    name: "e2e 1.14-1.18 java 21"
    needs: [build-jars, unit-tests, e2e-gate,
            e2e-mc121-java21, e2e-mc121-java25, e2e-mc121-java26,
            e2e-mc26-java25, e2e-mc26-java26,
            e2e-t0-java21, e2e-t0-java25, e2e-t0-java26,
            e2e-mc1192-java17, e2e-mc1192-java21]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.build-jars.outputs.mc114_java21 != '[]' }}
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.build-jars.outputs.mc114_java21 }}
      java: "21"
      jar-sha: ${{ github.sha }}
