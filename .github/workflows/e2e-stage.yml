# One reusable e2e submatrix. Every stage in e2e.yml calls this instead of
# repeating forty lines of download-jars / make e2e-ci / upload-logs, so a new
# version band costs one `uses:` block, not a copy-paste.
#
# The caller supplies the version list as a JSON array string; this workflow
# expands it into the matrix. The caller is responsible for NOT calling this
# with an empty list (GitHub errors on a `[]` matrix rather than skipping it) —
# that is what the `!= '[]'` guard in e2e.yml is for.
name: E2E stage

on:
  workflow_call:
    inputs:
      versions:
        description: "JSON array of Minecraft versions, e.g. '[\"1.21\",\"1.21.1\"]'"
        required: true
        type: string
      java:
        description: "Java major version to run the servers on (8, 17, 21, 25 or 26)"
        required: true
        type: string
      jar-sha:
        description: "github.sha of the run that uploaded the jar artifacts"
        required: true
        type: string

jobs:
  run:
    # Displays as "<caller job name> / <mc>", e.g. "e2e 1.21.x java 21 / 1.21.4".
    name: "${{ matrix.mc }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(inputs.versions) }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Every jar is fetched regardless of the version under test: `make
      # e2e-ci` depends on all jar file targets. `merge-multiple` lands them
      # in one directory, so split artifacts cost one download step, not N.
      - name: "Download prebuilt jars"
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: commandsspy-jar-*-${{ inputs.jar-sha }}
          merge-multiple: true
          path: build/libs

      # The Makefile's jar targets are real file rules, so present files mean
      # Gradle is never invoked here. This job needs no Java and no Gradle
      # cache: the JVM under test lives in the Docker image, not on the runner.
      - name: "Verify prebuilt jars are in place"
        run: |
          ls -l build/libs
          test -f build/libs/commandsspy-*+mc1.21.x.jar
          test -f build/libs/commandsspy-*+mc1.19-1.20.2.jar
          test -f build/libs/commandsspy-*+mc1.14.x.jar
          test -f build/libs/commandsspy-*+mc26.x.jar

      # ubuntu-latest ships Docker; no setup action is required.
      - name: "E2E: Minecraft ${{ matrix.mc }} on Java ${{ inputs.java }}"
        run: make e2e-ci VERSIONS="${{ matrix.mc }}" JAVA="${{ inputs.java }}" PARALLEL=1

      - name: "Upload e2e logs (Minecraft ${{ matrix.mc }}, Java ${{ inputs.java }})"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs-mc${{ matrix.mc }}-java${{ inputs.java }}-${{ inputs.jar-sha }}
          path: |
            build/e2e-logs/
            build/e2e-results/
          if-no-files-found: warn
          retention-days: 7
