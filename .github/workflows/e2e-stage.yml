# One reusable e2e submatrix, called by every stage in e2e.yml.
# The caller must not pass an empty list: GitHub errors on a [] matrix.
name: E2E stage

on:
  workflow_call:
    inputs:
      versions:
        description: "JSON array of Minecraft versions, e.g. '[\"1.21\",\"1.21.1\"]'"
        required: true
        type: string
      java:
        description: "Java major version to run the servers on (8, 17, 21, 25 or 26)"
        required: true
        type: string
      jar-sha:
        description: "github.sha of the run that uploaded the jar artifacts"
        required: true
        type: string
      loader:
        description: "fabric, quilt, forge, neoforge, babric or bta — one per call, so each loader renders as its own job group in the Actions UI"
        required: true
        type: string
      config-variant:
        description: "1 = the config-behaviors leg (pre-seeded blacklist + logArguments:true); 0 = the default assertions"
        required: false
        default: "0"
        type: string
      fabric-expect-refused:
        description: "1 = the Fabric/Quilt out-of-range guard leg: this Minecraft version is outside every declared minecraft range and the loader MUST refuse the mod"
        required: false
        default: "0"
        type: string
      forge-refusal-probe:
        description: "1 = the Forge out-of-range guard leg: route this version to the MODERN jar regardless of its own band, so mods.toml's minecraft range (ceiling <1.21.6) is what refuses it. LOADER=forge only"
        required: false
        default: "0"
        type: string

jobs:
  run:
    # Displays as "<caller job name> / <mc>", e.g. "e2e 1.21.x java 21 (quilt) / 1.21.4" —
    # the caller job name itself carries the loader (see e2e.yml), so each
    # loader is its own visually separate group instead of interleaved rows
    # in one shared group.
    name: "${{ matrix.mc }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJSON(inputs.versions) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Every jar is fetched regardless of the version under test: `make
      # e2e-ci` depends on all jar file targets. `merge-multiple` lands them
      # in one directory, so split artifacts cost one download step, not N.
      - name: "Download prebuilt jars"
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: commandsspy-jar-*-${{ inputs.jar-sha }}
          merge-multiple: true
          path: build/libs

      # All four Forge jars travel in the same artifact bundle, but they are
      # produced by the separate forge/ Gradle build, so `make` expects them
      # under forge/build/libs. Move them there rather than teaching Make two
      # locations. All four, regardless of which versions THIS call's own
      # `matrix.mc` covers: this reusable workflow only knows its own
      # `versions` list, not which jar each version needs -- that
      # per-version jar selection is scripts/e2e-run-one.sh's job (its
      # FORGE_JAR_BAND routing table), so this step just needs every jar on
      # disk, not to decide between them.
      - name: "Stage the Forge jars"
        if: inputs.loader == 'forge'
        run: |
          mkdir -p forge/build/libs
          mv build/libs/commandsspy-*+mc1.21.x-forge.jar forge/build/libs/
          mv build/libs/commandsspy-*+mc1.17-1.20.4-forge.jar forge/build/libs/
          mv build/libs/commandsspy-*+mc1.21.6-26.2-forge.jar forge/build/libs/
          mv build/libs/commandsspy-*+mc1.16.x-forge.jar forge/build/libs/
          ls -l forge/build/libs

      # Same move as the Forge staging step above, for the same reason: the
      # Babric jar comes out of the separate babric/ Gradle build, so `make`
      # expects it under babric/build/libs. Only on the babric leg -- it is the
      # only loader whose jar Make looks for there, and moving it
      # unconditionally would just fail every other leg.
      - name: "Stage the Babric jar"
        if: inputs.loader == 'babric'
        run: |
          mkdir -p babric/build/libs
          mv build/libs/commandsspy-*+mcb1.7.3-babric.jar babric/build/libs/
          ls -l babric/build/libs

      # And again for BTA, whose jar comes out of the separate bta/ Gradle
      # build and which Make therefore looks for under bta/build/libs. Only on
      # the bta leg, for the same reason the Babric move is conditional.
      - name: "Stage the BTA jar"
        if: inputs.loader == 'bta'
        run: |
          mkdir -p bta/build/libs
          mv build/libs/commandsspy-*+bta7.3-8.0.1-bta.jar bta/build/libs/
          ls -l bta/build/libs

      # Present jar files mean Gradle is never invoked here. The JVM under test
      # lives in the Docker image, not on the runner.
      - name: "Verify prebuilt jars are in place"
        run: |
          ls -l build/libs
          test -f build/libs/commandsspy-*+mc1.21.x.jar
          test -f build/libs/commandsspy-*+mc1.19-1.20.2.jar
          test -f build/libs/commandsspy-*+mc1.14.x.jar
          test -f build/libs/commandsspy-*+mc26.x.jar
          test -f build/libs/commandsspy-*+mc1.20.2-26.2-neoforge.jar

      # Its own step because the jar is staged elsewhere and only on this leg.
      - name: "Verify the prebuilt Babric jar is in place"
        if: inputs.loader == 'babric'
        run: |
          ls -l babric/build/libs
          test -f babric/build/libs/commandsspy-*+mcb1.7.3-babric.jar

      # Its own step for the same reason as the Babric one above.
      - name: "Verify the prebuilt BTA jar is in place"
        if: inputs.loader == 'bta'
        run: |
          ls -l bta/build/libs
          test -f bta/build/libs/commandsspy-*+bta7.3-8.0.1-bta.jar

      # Keyed by MC version + loader (not Java): scripts/e2e-run-one.sh's
      # cache key is version+loader+installer, and the loader/installer
      # choice never depends on which JVM the server runs on, so a java21
      # run and a java25 run of the same {MC version, loader} share one
      # cache entry.
      - name: "Restore the server launcher jar cache"
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-e2e-jars
          key: e2e-jar-${{ matrix.mc }}-${{ inputs.loader }}

      - name: "E2E: Minecraft ${{ matrix.mc }} on Java ${{ inputs.java }} (${{ inputs.loader }}${{ inputs.config-variant == '1' && ', config behaviors' || '' }}${{ (inputs.fabric-expect-refused == '1' || inputs.forge-refusal-probe == '1') && ', out-of-range guard' || '' }})"
        run: make e2e-ci VERSIONS="${{ matrix.mc }}" JAVA="${{ inputs.java }}" LOADER="${{ inputs.loader }}" CONFIG_VARIANT="${{ inputs.config-variant }}" FABRIC_EXPECT_REFUSED="${{ inputs.fabric-expect-refused }}" FORGE_REFUSAL_PROBE="${{ inputs.forge-refusal-probe }}" PARALLEL=1

      - name: "Upload e2e logs (Minecraft ${{ matrix.mc }}, Java ${{ inputs.java }}, ${{ inputs.loader }})"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs-mc${{ matrix.mc }}-java${{ inputs.java }}-${{ inputs.loader }}${{ inputs.config-variant == '1' && '-cfgvar' || '' }}${{ (inputs.fabric-expect-refused == '1' || inputs.forge-refusal-probe == '1') && '-refusal' || '' }}-${{ inputs.jar-sha }}
          path: |
            build/e2e-logs/
            build/e2e-results/
          if-no-files-found: warn
          retention-days: 7
