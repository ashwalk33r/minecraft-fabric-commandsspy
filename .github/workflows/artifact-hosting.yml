name: Artifact Hosting

"on": # quoted to avoid YAML 1.1 boolean parsing of unquoted 'on' -> True in some parsers
  workflow_dispatch:
  pull_request:

jobs:
  host-artifact:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    name: "Build and host artifact"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gradle
      - name: "Build: mod compilation"
        run: ./gradlew build
      - name: "Upload: built mod artifact (30 days)"
        uses: actions/upload-artifact@v5
        with:
          name: commandsspy-hosted-artifact-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30
