name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # '|' falls back to direct on network errors too; ',' only on 404.
  GOPROXY: 'https://proxy.golang.org|direct'

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Verify action pins"
        run: scripts/verify-action-pins.sh
      - uses: gradle/actions/wrapper-validation@v6.3.0
      # Public repo -> free/unlimited GHCR; only needed to publish on a
      # Dockerfile.ci change (pulls of the public package need no auth).
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'neoforge/gradle.properties', 'neoforge/build.gradle') }}

      # Before lint on purpose: a behavioural regression fails in the first minute under a named check.
      - name: "Test: unit tests (all four Minecraft targets)"
        run: make test
      - name: "Test: upload the test reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-test-reports-${{ github.sha }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 7

      - name: "Static code analysis: checkstyle + PMD"
        run: make lint-java

      # `gradle build` = assemble + check, so the NeoForge jars this also builds
      # get their checkstyle/pmd pass here (neoforge/build.gradle applies both);
      # they have no unit tests — the suite lives in the root, Fabric-bound project.
      - name: "Build: mod compilation (all six jars: four Fabric/Quilt eras + two NeoForge lines)"
        run: make build
      - name: "Build: upload the mod artifact (Minecraft 1.21.x target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.21.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.21.x.jar
          if-no-files-found: error
          retention-days: 30
      - name: "Build: upload the mod artifact (Minecraft 1.19-1.20.2 target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.19-1.20.2-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.19-1.20.2.jar
          if-no-files-found: error
          retention-days: 30
      - name: "Build: upload the mod artifact (Minecraft 1.14-1.18 target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.14.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.14.x.jar
          if-no-files-found: error
          retention-days: 30
      - name: "Build: upload the mod artifact (Minecraft 26.x target)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc26.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc26.x.jar
          if-no-files-found: error
          retention-days: 30
      - name: "Build: upload the mod artifact (NeoForge 21.1.x / Minecraft 1.21.1)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-neoforge-mc1.21.1-${{ github.sha }}
          path: build/libs/commandsspy-*+neoforge-mc1.21.1.jar
          if-no-files-found: error
          retention-days: 30
      - name: "Build: upload the mod artifact (NeoForge 26.2.x / Minecraft 26.2)"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-neoforge-mc26.2-${{ github.sha }}
          path: build/libs/commandsspy-*+neoforge-mc26.2.jar
          if-no-files-found: error
          retention-days: 30

  # Fast quality gate: exactly `make ci`, which runs the gate INSIDE the
  # pinned Dockerfile.ci container — the same image, tag, and entry path as
  # the tracked pre-commit hook. Green locally IS green here, by
  # construction (tool versions live in Dockerfile.ci, not on this runner).
  go-tools:
    name: "Go tools"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-go
          key: ci-go-${{ hashFiles('Dockerfile.ci', 'tools/go.mod') }}
      - name: "Quality gate: make ci"
        run: make ci
