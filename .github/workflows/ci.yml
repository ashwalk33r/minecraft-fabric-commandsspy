    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.mc26_java25 }}
      java: "25"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-mc26-java26-fabric:
    name: "e2e 26.x java 26 (fabric)"
