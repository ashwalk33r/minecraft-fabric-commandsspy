    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.mc121_java26 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.mc121_java26 }}
      java: "26"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java26-quilt:
    name: "e2e 1.21.x java 26 (quilt)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
