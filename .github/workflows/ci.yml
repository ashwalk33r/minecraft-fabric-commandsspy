# Single CI pipeline: cheap gates -> nine parallel jar builds -> e2e fleet.
# Replaces the old gradle.yml (Build) + e2e.yml pair, which duplicated
# `make test` and `make build` on every PR. See docs/ci.md.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # '|' falls back to direct on network errors too; ',' only on 404.
  GOPROXY: 'https://proxy.golang.org|direct'

jobs:
  # ---------------------------------------------------------------- Tier 0
  # Cheap parallel gates, cheapest steps first inside each job.

  contracts:
    name: "Contracts: action pins, wrapper, e2e grid, jar routing"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    outputs:
      mc121_java21: ${{ steps.grid.outputs.mc121_java21 }}
      mc121_java25: ${{ steps.grid.outputs.mc121_java25 }}
      mc121_java26: ${{ steps.grid.outputs.mc121_java26 }}
      mc26_java25: ${{ steps.grid.outputs.mc26_java25 }}
      mc26_java26: ${{ steps.grid.outputs.mc26_java26 }}
      t0_java21: ${{ steps.grid.outputs.t0_java21 }}
      t0_java25: ${{ steps.grid.outputs.t0_java25 }}
      t0_java26: ${{ steps.grid.outputs.t0_java26 }}
      mc1192_java17: ${{ steps.grid.outputs.mc1192_java17 }}
      mc1192_java21: ${{ steps.grid.outputs.mc1192_java21 }}
      mc114_java8: ${{ steps.grid.outputs.mc114_java8 }}
      mc114_java17: ${{ steps.grid.outputs.mc114_java17 }}
      mc114_java21: ${{ steps.grid.outputs.mc114_java21 }}
      forge_java21: ${{ steps.grid.outputs.forge_java21 }}
      forge_legacy_java17: ${{ steps.grid.outputs.forge_legacy_java17 }}
      forge_mc116_java8: ${{ steps.grid.outputs.forge_mc116_java8 }}
      forge_eventbus7_java21: ${{ steps.grid.outputs.forge_eventbus7_java21 }}
      forge_eventbus7_java25: ${{ steps.grid.outputs.forge_eventbus7_java25 }}
      neo_java17: ${{ steps.grid.outputs.neo_java17 }}
      neo_java21: ${{ steps.grid.outputs.neo_java21 }}
      neo_java25: ${{ steps.grid.outputs.neo_java25 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Verify action pins"
        run: scripts/verify-action-pins.sh
      - uses: gradle/actions/wrapper-validation@v6.3.0
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # Restore-only: go-quality owns the ci-go cache save (its `make ci`
      # populates the richer cache; a save race here would clobber it).
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-go
          key: ci-go-${{ hashFiles('Dockerfile.ci', 'tools/go.mod') }}
      - name: "Assert the e2e grid contract"
        run: make ci-tools-test
      # Probes the real version->jar routing paths so cross-file drift fails here, not in a boot.
      - name: "Assert the version->jar routing contract"
        run: scripts/test-jar-routing.sh
      # THE single source of stage definitions. Lean grid on pull_request,
      # full cross-product on workflow_dispatch, all-empty on push; absent
      # bands emit [].
      - name: "Compute the gated version lists for this trigger"
        id: grid
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: make ci-gen-matrix

  # Fast quality gate: exactly `make ci`, which runs the gate INSIDE the
  # pinned Dockerfile.ci container — the same image, tag, and entry path as
  # the tracked pre-commit hook. Green locally IS green here, by
  # construction (tool versions live in Dockerfile.ci, not on this runner).
  go-quality:
    name: "Quality gate: Go/shell lint+vet+build+test (make ci)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-go
          key: ci-go-${{ hashFiles('Dockerfile.ci', 'tools/go.mod') }}
      - name: "Quality gate: make ci"
        run: make ci

  lint-java:
    name: "Static analysis: checkstyle + PMD (make lint-java)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-lint-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Static code analysis: checkstyle + PMD"
        run: make lint-java

  # `make test` runs all four targets inside the pinned Dockerfile.ci image —
  # no runner-installed JDK needed for any target, including the 26.x one.
  unit-tests:
    name: "Unit tests: routing contract + all four Minecraft targets (make test)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # Own key on purpose: nine build jobs + this one restoring/saving a
      # single shared key would race the save and lose all but one cache.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-test-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Test: unit tests (all four Minecraft targets)"
        run: make test
      - name: "Test: upload the test reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-test-reports-${{ github.sha }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------- Tier 1
  # Nine parallel build jobs, one jar each. Per-target gradle cache keys on
  # purpose: a single shared key is saved by whichever job finishes first,
  # so the other targets' (ForgeGradle decompile) caches would never persist
  # and every run would rebuild cold. One multi-path upload step per job; the
  # follow-up step prints a grouped log with the artifact link.

  # `gradle build` = assemble + check per invocation, so the NeoForge band
  # jar gets its checkstyle/pmd pass in its own job (neoforge/build.gradle
  # applies both); it has no unit tests — the suite lives in the root,
  # Fabric-bound project. One Gradle invocation per job: Makefile
  # .NOTPARALLEL only serializes inside a single make process.
  build-mc121x:
    name: "Build: Fabric/Quilt 1.21.x jar (MC 1.21-1.21.11)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-mc121x-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (mc1.21.x target, make build-121)"
        run: make build-121
      - name: "Upload: the mc1.21.x jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.21.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.21.x.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l build/libs/commandsspy-*.jar
          echo "::endgroup::"

  build-mc1192:
    name: "Build: Fabric/Quilt 1.19-1.20.2 jar"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-mc1192-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (mc1.19-1.20.2 target, make build-1192)"
        run: make build-1192
      - name: "Upload: the mc1.19-1.20.2 jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.19-1.20.2-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.19-1.20.2.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l build/libs/commandsspy-*.jar
          echo "::endgroup::"

  build-mc114x:
    name: "Build: Fabric/Quilt 1.14.x jar (MC 1.14-1.18)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-mc114x-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (mc1.14.x target, make build-114)"
        run: make build-114
      - name: "Upload: the mc1.14.x jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc1.14.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.14.x.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l build/libs/commandsspy-*.jar
          echo "::endgroup::"

  build-mc26x:
    name: "Build: Fabric/Quilt 26.x jar"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-mc26x-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (mc26.x target, make build-26)"
        run: make build-26
      - name: "Upload: the mc26.x jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-mc26.x-${{ github.sha }}
          path: build/libs/commandsspy-*+mc26.x.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l build/libs/commandsspy-*.jar
          echo "::endgroup::"

  build-neo:
    name: "Build: NeoForge band jar (MC 1.20.2-26.2)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-neo-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (neoforge band target, make build-neo)"
        run: make build-neo
      - name: "Upload: the neoforge band jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-neoforge-${{ github.sha }}
          path: build/libs/commandsspy-*+mc1.20.2-26.2-neoforge.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l build/libs/commandsspy-*.jar
          echo "::endgroup::"

  # Separate job and separate Gradle build (forge/), on purpose: ForgeGradle
  # never touches the five jars above. First build decompiles Minecraft, so
  # it is slow when its per-target ci-gradle cache misses.
  build-forge-modern:
    name: "Build: Forge modern (MC 1.20.6-1.21.5)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-forge-modern-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (Forge target, Minecraft 1.20.6-1.21.5)"
        run: make build-forge
      - name: "Upload: the modern Forge jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-forge-modern-${{ github.sha }}
          path: forge/build/libs/commandsspy-*+mc1.21.x-forge.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l forge/build/libs/commandsspy-*.jar
          echo "::endgroup::"

  # Legacy Forge target: SRG-reobfuscated jar, issue #28 task 1. Same forge/
  # Gradle build, -PforgeTarget=legacy; decompiles Minecraft against its own
  # compile target.
  build-forge-legacy:
    name: "Build: Forge legacy SRG (MC 1.17.1-1.20.4)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-forge-legacy-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (Forge target, Minecraft 1.17.1-1.20.4, legacy SRG)"
        run: make build-forge-legacy
      - name: "Upload: the legacy Forge jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-forge-legacy-${{ github.sha }}
          path: forge/build/libs/commandsspy-*+mc1.17-1.20.4-forge.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l forge/build/libs/commandsspy-*.jar
          echo "::endgroup::"

  # mc116 Forge target: issue #30, SRG-reobfuscated jar with its own
  # entrypoint source for the pre-1.17 era (-PforgeTarget=mc116).
  build-forge-mc116:
    name: "Build: Forge mc116 SRG (MC 1.14-1.16.5)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-forge-mc116-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (Forge target, Minecraft 1.14-1.16.5, mc116 SRG)"
        run: make build-forge-mc116
      - name: "Upload: the mc116 Forge jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-forge-mc116-${{ github.sha }}
          path: forge/build/libs/commandsspy-*+mc1.16.x-forge.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l forge/build/libs/commandsspy-*.jar
          echo "::endgroup::"

  # EventBus-7 Forge target: issue #32 task 2, for Forge 56+ (Minecraft
  # 1.21.6-26.2), -PforgeTarget=eventbus7.
  build-forge-eventbus7:
    name: "Build: Forge EventBus-7 (MC 1.21.6-26.2)"
    runs-on: ubuntu-latest
    needs: [contracts]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-ci-gradle
          key: ci-gradle-forge-eventbus7-${{ hashFiles('Dockerfile.ci', 'gradle.properties', 'build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'forge/build.gradle', 'forge/gradle.properties', 'neoforge/build.gradle', 'neoforge/gradle.properties') }}
      - name: "Build: mod compilation (Forge target, Minecraft 1.21.6-26.2, EventBus 7)"
        run: make build-forge-eventbus7
      - name: "Upload: the EventBus-7 Forge jar"
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commandsspy-jar-forge-eventbus7-${{ github.sha }}
          path: forge/build/libs/commandsspy-*+mc1.21.6-26.2-forge.jar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}
      - name: "Artifact links"
        run: |
          echo "::group::Uploaded jar -> ${{ steps.upload.outputs.artifact-url }}"
          ls -l forge/build/libs/commandsspy-*.jar
          echo "::endgroup::"

  # ------------------------------------------------------------ Aggregator
  # Named `Build` on purpose: main's branch protection requires the status
  # check context "Build" (previously gradle.yml's job). This job is the one
  # required check; it fails on ANY failed, cancelled, or skipped dependency
  # (skipped too, so a future `if:` on a build job cannot vacuously green
  # the required check).
  build-summary:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [contracts, go-quality, lint-java, unit-tests,
            build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy,
            build-forge-mc116, build-forge-eventbus7]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: "All artifact links (one grouped log)"
        run: |
          echo "::group::All build artifacts"
          echo "mc1.21.x:          ${{ needs.build-mc121x.outputs.artifact-url }}"
          echo "mc1.19-1.20.2:     ${{ needs.build-mc1192.outputs.artifact-url }}"
          echo "mc1.14.x:          ${{ needs.build-mc114x.outputs.artifact-url }}"
          echo "mc26.x:            ${{ needs.build-mc26x.outputs.artifact-url }}"
          echo "neoforge-band:     ${{ needs.build-neo.outputs.artifact-url }}"
          echo "forge-modern:      ${{ needs.build-forge-modern.outputs.artifact-url }}"
          echo "forge-legacy:      ${{ needs.build-forge-legacy.outputs.artifact-url }}"
          echo "forge-mc116:       ${{ needs.build-forge-mc116.outputs.artifact-url }}"
          echo "forge-eventbus7:   ${{ needs.build-forge-eventbus7.outputs.artifact-url }}"
          echo "::endgroup::"
      - name: "Fail unless every dependency succeeded"
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "dependency results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "ERROR: a required job ended '$r'" >&2
              exit 1
            fi
          done

  e2e-gate:
    name: "e2e-gate (${{ matrix.mc }}, java ${{ matrix.java }}, ${{ matrix.loader }})"
    needs: [contracts, go-quality, lint-java, unit-tests,
            build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy,
            build-forge-mc116, build-forge-eventbus7]
    # No status function here, so GitHub prepends the implicit success()
    # check — push-to-main builds jars but runs no e2e.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      # fail-fast off: all four canaries must report.
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", java: "21", loader: "fabric" }
          - { mc: "1.21.11", java: "21", loader: "quilt" }
          - { mc: "26.2", java: "25", loader: "fabric" }
          - { mc: "26.2", java: "25", loader: "quilt" }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: "Download prebuilt jars (all Minecraft targets)"
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: commandsspy-jar-*-${{ github.sha }}
          merge-multiple: true
          path: build/libs
      - name: "Verify prebuilt jars are in place"
        run: |
          ls -l build/libs
          test -f build/libs/commandsspy-*+mc1.21.x.jar
          test -f build/libs/commandsspy-*+mc1.19-1.20.2.jar
          test -f build/libs/commandsspy-*+mc1.14.x.jar
          test -f build/libs/commandsspy-*+mc26.x.jar
          test -f build/libs/commandsspy-*+mc1.20.2-26.2-neoforge.jar
      # Keyed by MC version + loader: see the matching step in e2e-stage.yml.
      - name: "Restore the server launcher jar cache"
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/commandsspy-e2e-jars
          key: e2e-jar-${{ matrix.mc }}-${{ matrix.loader }}
      - name: "E2E: Minecraft ${{ matrix.mc }} on Java ${{ matrix.java }} (${{ matrix.loader }})"
        run: make e2e-ci VERSIONS="${{ matrix.mc }}" JAVA="${{ matrix.java }}" LOADER="${{ matrix.loader }}" PARALLEL=1
      - name: "Upload e2e logs (Minecraft ${{ matrix.mc }}, Java ${{ matrix.java }}, ${{ matrix.loader }})"
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs-mc${{ matrix.mc }}-java${{ matrix.java }}-${{ matrix.loader }}-${{ github.sha }}
          path: |
            build/e2e-logs/
            build/e2e-results/
          if-no-files-found: warn
          retention-days: 7

  # NeoForge — deliberately NOT part of e2e-gate. The gate exists to stop a
  # broken build before the ~40-job Fabric/Quilt fan-out; a NeoForge break is
  # not a reason to withhold that coverage, so NeoForge runs alongside the gate
  # instead of in front of it.
  #
  # One band jar spans 1.20.2-26.2, so these three legs split on NeoForge's own
  # Java floor (17 up to 1.20.4, 21 through 1.21.11, 25 on 26.x) — not on jars.
  # Version lists come from tools/gen_matrix.go, hence the `!= '[]'` clause and
  # no `github.event_name != 'push'` guard: a generated band is already [] on
  # push, and each leg is its own job group for the Actions-UI reason the Quilt
  # variants are (see the stage comment below).
  e2e-neoforge-java17:
    name: "e2e 1.20.2-1.20.4 java 17 (neoforge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.neo_java17 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.neo_java17 }}
      java: "17"
      loader: "neoforge"
      jar-sha: ${{ github.sha }}

  e2e-neoforge-java21:
    name: "e2e 1.20.6-1.21.11 java 21 (neoforge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.neo_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.neo_java21 }}
      java: "21"
      loader: "neoforge"
      jar-sha: ${{ github.sha }}

  e2e-neoforge-java25:
    name: "e2e 26.2 java 25 (neoforge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.neo_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.neo_java25 }}
      java: "25"
      loader: "neoforge"
      jar-sha: ${{ github.sha }}

  # Config behaviors (#34): blacklist suppression + logArguments:true need the
  # config seeded BEFORE boot (CommandsSpy.CONFIG is a static final with no
  # reload path), so they cannot share the default legs' boots. One
  # representative version per loader — the assertions live in shared
  # CommandsSpy.handleCommand, so per-version repetition would buy nothing.
  e2e-config-behaviors-fabric:
    name: "e2e config-behaviors (fabric)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.21.11"]'
      java: "21"
      loader: "fabric"
      config-variant: "1"
      jar-sha: ${{ github.sha }}

  # versions must stay at or above 1.18: the config-behaviors mod-loaded
  # check in e2e-entrypoint.sh has no QUILT_ENTRYPOINT_GAP guard, and the
  # entrypoint banner it greps for never fires on quilt below 1.18.
  e2e-config-behaviors-quilt:
    name: "e2e config-behaviors (quilt)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.21.11"]'
      java: "21"
      loader: "quilt"
      config-variant: "1"
      jar-sha: ${{ github.sha }}

  e2e-config-behaviors-forge:
    name: "e2e config-behaviors (forge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.21.1"]'
      java: "21"
      loader: "forge"
      config-variant: "1"
      jar-sha: ${{ github.sha }}

  e2e-config-behaviors-neoforge:
    name: "e2e config-behaviors (neoforge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.21.1"]'
      java: "21"
      loader: "neoforge"
      config-variant: "1"
      jar-sha: ${{ github.sha }}

  # Out-of-range refusal guard: Minecraft 1.19.0 falls in the crack between the
  # mc114 ceiling (<1.19) and the mc1192 floor (>=1.19.1), so no jar claims it.
  # These two legs boot a real server there and assert the LOADER refuses the
  # mod, rather than the harness merely declining to run. Without them, widening
  # any minecraft_range_* in gradle.properties would let the jar load where its
  # mixin cannot apply — commandsspy.mixins.json is "required": true, so that is
  # a hard crash at server start. The offline half lives in
  # scripts/test-jar-routing.sh and fails in `contracts` before anything builds.
  e2e-fabric-refusal-guard:
    name: "e2e out-of-range refusal (fabric)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.19"]'
      java: "17"
      loader: "fabric"
      fabric-expect-refused: "1"
      jar-sha: ${{ github.sha }}

  e2e-quilt-refusal-guard:
    name: "e2e out-of-range refusal (quilt)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.19"]'
      java: "17"
      loader: "quilt"
      fabric-expect-refused: "1"
      jar-sha: ${{ github.sha }}

  # The Forge half of the same guard, and the reason it does not look like the
  # two legs above: Forge's declared ranges leave holes at 1.17 and 1.20.5, but
  # Forge published no server build for either version — the holes exist BECAUSE
  # nothing was published there — so a leg on them would die at
  # no-forge-build-for-version before a container started, not pass. The
  # bootable form of the same proposition puts the mismatch on the other axis:
  # forge-refusal-probe hands a version Forge DOES publish for the wrong band's
  # jar. 1.21.6 with the MODERN jar is the one pairing that isolates the
  # minecraft range — every band's loader_range mirrors its minecraft_range, so
  # anywhere else FML rejects on the language provider and never reads the
  # minecraft dependency; modern's loader_range [50,) is unbounded above, so
  # here only its <1.21.6 ceiling refuses. That refusal is the only thing
  # standing between an operator and a mod whose Minecraft calls do not resolve
  # on the runtime it was handed — and unlike the Fabric case that failure is
  # quiet, because the mc116/legacy split exists for a class rename
  # (CommandSource -> CommandSourceStack), so the wrong jar dies with
  # NoClassDefFoundError at the first command rather than at boot. The offline
  # half lives in scripts/test-jar-routing.sh, which pins both holes and all
  # four declared ranges and fails in `contracts` before anything builds.
  e2e-forge-refusal-guard:
    name: "e2e out-of-range refusal (forge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && github.event_name != 'push' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: '["1.21.6"]'
      java: "21"
      loader: "forge"
      forge-refusal-probe: "1"
      jar-sha: ${{ github.sha }}

  # Stage 2 — current mainstream (1.21.x, 26.x). The `if:` used on every stage job:
  # !cancelled() lets an upstream SKIP pass through, !contains(...'failure') still
  # stops on a real failure, and != '[]' skips an empty band (GitHub errors on a
  # [] matrix). Full explanation in docs/ci.md.
  #
  # Every band below runs as two separate job groups, one per loader
  # (fabric/quilt), in parallel — not one group with loader mixed into its
  # matrix rows — purely so the Actions UI shows two clearly separate,
  # independently-collapsible groups instead of interleaved rows in one
  # shared group. Stage ordering (popularity-first) is unaffected: each
  # band's `needs:` lists both loader variants of every prior band.
  e2e-mc121-java21-fabric:
    name: "e2e 1.21.x java 21 (fabric)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.mc121_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.mc121_java21 }}
      java: "21"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java21-quilt:
    name: "e2e 1.21.x java 21 (quilt)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.mc121_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.mc121_java21 }}
      java: "21"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  # Forge: five generated jobs (modern band, legacy band, mc116 band, and
  # the EventBus-7 band split across its two era Java floors).
  # Version lists and the full per-leg rationale live in tools/gen_matrix.go's
  # Forge stage — floor rows only, no coverage rows, by design.
  e2e-forge-java21:
    name: "e2e 1.20.6-1.21.5 java 21 (forge)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.forge_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.forge_java21 }}
      java: "21"
      loader: "forge"
      jar-sha: ${{ github.sha }}

  e2e-forge-legacy-java17:
    name: "e2e 1.17.1-1.20.4 java 17 (forge legacy)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.forge_legacy_java17 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.forge_legacy_java17 }}
      java: "17"
      loader: "forge"
      jar-sha: ${{ github.sha }}

  e2e-forge-mc116-java8:
    name: "e2e 1.14.4-1.16.5 java 8 (forge mc116)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.forge_mc116_java8 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.forge_mc116_java8 }}
      java: "8"
      loader: "forge"
      jar-sha: ${{ github.sha }}

  # EventBus-7 band, split by era Java floor: 1.21.6-1.21.11 on java 21,
  # 26.x on java 25 (the 26.x servers themselves require 25). Every measured
  # version, like the legacy band — rationale in tools/gen_matrix.go.
  e2e-forge-eventbus7-java21:
    name: "e2e 1.21.6-1.21.11 java 21 (forge eventbus7)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.forge_eventbus7_java21 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.forge_eventbus7_java21 }}
      java: "21"
      loader: "forge"
      jar-sha: ${{ github.sha }}

  e2e-forge-eventbus7-java25:
    name: "e2e 26.1-26.2 java 25 (forge eventbus7)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.forge_eventbus7_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.forge_eventbus7_java25 }}
      java: "25"
      loader: "forge"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java25-fabric:
    name: "e2e 1.21.x java 25 (fabric)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.mc121_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.mc121_java25 }}
      java: "25"
      loader: "fabric"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java25-quilt:
    name: "e2e 1.21.x java 25 (quilt)"
    needs: [contracts, build-mc121x, build-mc1192, build-mc114x, build-mc26x, build-neo, build-forge-modern, build-forge-legacy, build-forge-mc116, build-forge-eventbus7, unit-tests, e2e-gate]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.contracts.outputs.mc121_java25 != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e-stage.yml
    with:
      versions: ${{ needs.contracts.outputs.mc121_java25 }}
      java: "25"
      loader: "quilt"
      jar-sha: ${{ github.sha }}

  e2e-mc121-java26-fabric:
