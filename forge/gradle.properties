org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Phase-1 spike: ONE band only (Minecraft 1.21.1 / Forge 52.1.x). Deliberately no
# -PmcTarget-style era switch — a switch for a single row is scaffolding for a
# Phase 2 that only happens if the R1 measurement comes back good.
minecraft_version=1.21.1
forge_version=52.1.16
mapping_version=1.21.1

# MEASURED, not assumed — this is the whole point of the Phase-1 spike. This one
# jar was booted, with the full e2e assertion set, on 1.20.6 / 1.21 / 1.21.1 /
# 1.21.3 / 1.21.4 / 1.21.5 (Forge 50, 51, 52, 53, 54, 55): all pass.
#
# Floor 1.20.6, and it is a HARD floor, not conservatism: Forge ships Mojang
# official mappings at runtime only from 1.20.5 on, and there is no Forge build
# for 1.20.5 at all. On 1.20.4 (SRG runtime) this jar loads, logs its banner, and
# then kills the server with NoSuchMethodError CommandSourceStack.getEntity() on
# the first command executed. Widening this range below 1.20.6 without also
# adding a reobfuscated jar crashes servers. Measured, see docs/version-matrix.md.
#
# Ceiling <1.21.6: Forge's EventBus 6 -> 7 break lands between 1.21.5 and 1.21.8
# and needs a second entrypoint variant. Known upstream boundary, not measured.
minecraft_range=[1.20.6,1.21.6)
# Forge 50 is the 1.20.6 line — the same floor the minecraft range states.
forge_range=[50,)
loader_range=[50,)
