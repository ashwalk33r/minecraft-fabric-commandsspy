org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Two rows, one per -PforgeTarget (default 'modern'). Same idiom as the root
# build's -PmcTarget dispatch and neoforge/'s -PneoTarget: adding a target is
# a change here and in build.gradle, not a scavenger hunt.

# modern (default): Phase-1 shipping jar, unchanged. Forge ships Mojang
# official mappings at runtime only from 1.20.5 on, and there is no Forge
# build for 1.20.5 at all -- hence the 1.20.6 floor. Ceiling <1.21.6: Forge's
# EventBus 6 -> 7 break lands between 1.21.5 and 1.21.8 and needs a second
# entrypoint variant (issue #28 task 2, not yet built).
minecraft_version_modern=1.21.1
forge_version_modern=52.1.16
mapping_version_modern=1.21.1
minecraft_range_modern=[1.20.6,1.21.6)
# Forge 50 is the 1.20.6 line -- the same floor the minecraft range states.
forge_range_modern=[50,)
loader_range_modern=[50,)

# legacy: SRG-reobfuscated jar for the pre-1.20.5 era (issue #28 task 1).
# Compile target Minecraft 1.20.1 / Forge 47.4.20 -- the newest legacy
# build, last Minecraft release where Forge's runtime is SRG-mapped
# (1.20.4 and older per MDK-Examples), largest legacy Forge server base.
#
# MEASURED range, not assumed -- see docs/version-matrix.md for the full
# per-version boot table. Floor 1.17.1 and ceiling <1.20.5 are both hard,
# both measured:
#   - 1.16.5/1.16.4 (Forge 36.2.x/35.1.x): FAIL. 1.16.5 hits
#     NoClassDefFoundError on net.minecraft.commands.CommandSourceStack --
#     that class does not exist under that name/package in 1.16.x's own
#     official mapping (Mojang renamed it upstream of Forge's obfuscation
#     layer, somewhere in the 1.16.5 -> 1.17.1 gap). 1.16.4 separately hits
#     an unrelated ModLauncher/JDK bug before mod code runs. Neither is an
#     SRG member-id stability problem.
#   - 1.17.1 (Forge 37.1.1) through 1.20.4 (Forge 49.x): PASS, every probed
#     version, seven consecutive Forge major branches (37/39/40/42/43/47/48/49).
#     SRG member ids ARE stable across this whole span.
#   - 1.20.5: excluded, Forge publishes no build at all (same gap the
#     modern jar's own floor hits).
minecraft_version_legacy=1.20.1
forge_version_legacy=47.4.20
mapping_version_legacy=1.20.1
minecraft_range_legacy=[1.17.1,1.20.5)
# Forge 37 is the 1.17.1 line (the measured floor); 50 is the 1.20.6 line,
# the modern jar's own floor -- the two jars' ranges are adjacent, not
# overlapping.
forge_range_legacy=[37,50)
loader_range_legacy=[37,50)
