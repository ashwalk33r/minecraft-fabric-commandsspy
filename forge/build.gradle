// Separate Gradle build ON PURPOSE: ForgeGradle and Loom both own a `minecraft`
// extension and remap/run tasks, and the root build produces four SHIPPING jars
// verified across ~84 CI jobs. Isolation costs one settings.gradle; see docs/forge.md.
//
// -PforgeTarget switches which Forge era this build compiles/renames for --
// same idiom as the root build's -PmcTarget and neoforge/'s -PneoTarget:
//   modern (default) - Phase-1 shipping jar, Mojang official mappings at
//     runtime, Minecraft 1.20.6-1.21.5.
//   legacy - issue #28 task 1: SRG-reobfuscated jar for the pre-1.20.5 era,
//     Minecraft 1.17.1-1.20.4. Needs net.minecraftforge.renamer (below) since
//     Forge does not ship Mojang official mappings on that era's runtime.
//   eventbus7 - issue #32 task 2: EventBus-7 entrypoint, Minecraft
//     1.21.6-26.2 (measured), where Forge's Event -> MutableEvent break makes
//     the modern entrypoint's MinecraftForge.EVENT_BUS registration
//     uncompilable. Official mappings at runtime like modern; only the
//     entrypoint source differs (src/eventbus7/java replaces src/main/java,
//     shared core unchanged).
//   mc116 - issue #30: SRG-reobfuscated jar for the pre-1.17 era, Minecraft
//     1.14-1.16.5 (measured). Like legacy it needs the renamer, but ALSO its
//     own entrypoint source (src/mc116/java): pre-1.17 dev-time class names
//     are the MCP ones (CommandSource, not CommandSourceStack), and the jar
//     compiles --release 8 for the era's Java-8 servers.
plugins {
	id 'java'
	id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
	// Pinned exact, not a range -- the plugin is young, v1.x, actively
	// iterating; MDK-Examples pins 1.1.2 against FG7 [7.0.29,8.0).
	// `apply false`: only the legacy target needs it.
	id 'net.minecraftforge.renamer' version '1.1.2' apply false
}

// Root .env.version stays the single MOD_VERSION source for every loader.
def envVersionProps = new Properties()
file("${rootDir}/../.env.version").withInputStream { envVersionProps.load(it) }
def modVersion = envVersionProps.getProperty('MOD_VERSION')
if (modVersion == null || modVersion.isBlank()) {
	throw new GradleException("MOD_VERSION not found or empty in ../.env.version")
}

def forgeTarget = (findProperty('forgeTarget') ?: 'modern') as String
if (!(forgeTarget in ['modern', 'legacy', 'eventbus7', 'mc116'])) {
	throw new GradleException("Unknown -PforgeTarget=${forgeTarget}. Supported values: modern (default), legacy, eventbus7, mc116")
}
def isLegacy = forgeTarget == 'legacy'
def isEventBus7 = forgeTarget == 'eventbus7'
def isMc116 = forgeTarget == 'mc116'
if (isLegacy || isMc116) {
	apply plugin: 'net.minecraftforge.renamer'
}

// One row per target, sourced from gradle.properties, derived once -- adding
// a target is a change in the two files, not a scavenger hunt.
def targetMinecraftVersion = project.getProperty("minecraft_version_${forgeTarget}")
def targetForgeVersion = project.getProperty("forge_version_${forgeTarget}")
def targetMappingVersion = project.getProperty("mapping_version_${forgeTarget}")
def targetMinecraftRange = project.getProperty("minecraft_range_${forgeTarget}")
def targetForgeRange = project.getProperty("forge_range_${forgeTarget}")
def targetLoaderRange = project.getProperty("loader_range_${forgeTarget}")

// modern reproduces today's exact Phase-1 filename: commandsspy-<ver>+mc1.21.x-forge.jar
// (baked into `version`, no classifier). legacy's plain `jar` task output is an
// unshipped intermediate (official-mapped, not SRG) -- the renamer step below
// produces the actual shipped legacy artifact with its own name/classifier.
version = isLegacy ? "${modVersion}+mc1.17-1.20.4"
	: isEventBus7 ? "${modVersion}+mc1.21.6-26.2-forge"
	: isMc116 ? "${modVersion}+mc1.16.x"
	: "${modVersion}+mc1.21.x-forge"
group = 'm2x.commandsspy'
base.archivesName = 'commandsspy'

// Minecraft 1.20.6+ ships Java 21 to end users; the legacy 1.17.1-1.20.4 era
// ships Java 17; the mc116 pre-1.17 era ships Java 8. mc116 keeps the
// 17 toolchain and cross-compiles via --release 8 below -- the CI image
// carries no JDK 8 and must not need one.
java.toolchain.languageVersion = JavaLanguageVersion.of((isLegacy || isMc116) ? 17 : 21)

minecraft {
	mappings channel: 'official', version: targetMappingVersion
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${targetMinecraftVersion}-${targetForgeVersion}")
}

// The shared core is COMPILED FROM ONE COPY, never forked. It contains no loader
// API references, which is what Phase 0 bought. eventbus7 swaps ONLY the
// entrypoint source dir (EventBus 7 renamed the registration surface, so the
// EventBus-6 file cannot compile against Forge 56+ and vice versa); modern
// and legacy keep compiling the default src/main/java entrypoint.
if (isEventBus7) {
	sourceSets.main.java.setSrcDirs(['src/eventbus7/java', '../src/main/java'])
} else if (isMc116) {
	// mc116 swaps the entrypoint the same way eventbus7 does: the default
	// src/main/java entrypoint uses a Java-16+ pattern-matching instanceof,
	// which cannot compile under --release 8. The extra resources dir adds
	// pack.mcmeta: Forge 32.x (1.16.1) NPEs in ResourcePackLoader on any mod
	// jar without one (measured, #30); later Forges only warn.
	sourceSets.main.java.setSrcDirs(['src/mc116/java', '../src/main/java'])
	sourceSets.main.resources.srcDir 'src/mc116/resources'
} else {
	sourceSets.main.java.srcDir '../src/main/java'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	if (isMc116) {
		// Era-correct bytecode: 1.16.x servers run Java 8. Same idiom as the
		// root build's per-target `options.release`.
		options.release = 8
	}
}

tasks.named('processResources', ProcessResources) {
	def props = [
		version: modVersion,
		minecraft_range: targetMinecraftRange,
		forge_range: targetForgeRange,
		loader_range: targetLoaderRange,
	]
	inputs.property 'replaceProperties', props
	filesMatching('META-INF/mods.toml') { expand props }
}

if (isLegacy || isMc116) {
	// Renames the compiled official-mapped jar down to SRG names for the
	// pre-1.20.5 runtimes, where Forge does not ship Mojang official
	// mappings (legacy: 1.17.1-1.20.4, m_xxxxx_ ids; mc116: pre-1.17,
	// func_xxxxx_ ids — its dev-time CLASS names are already the runtime
	// MCP ones, so members are the only thing left to map; the class-name
	// gap is what the src/mc116 source variant covers). Creates task
	// 'renameJar';
	// classifier 'forge' -> final name commandsspy-<version>-forge.jar.
	// This SRG-renamed jar is the one the e2e harness boots and the one the
	// Makefile's MOD_JAR_FORGE_LEGACY/_MC116 point at -- not the plain `jar`
	// task's official-name output, which stays an unshipped intermediate.
	renamer.classes(tasks.named('jar', Jar)) {
		map.from minecraft.dependency.toSrgFile
		archiveClassifier = 'forge'
	}
}
