plugins {
	// Loom ships two mutually exclusive plugin IDs: 'fabric-loom' (remapping, obfuscated
	// Minecraft) and 'net.fabricmc.fabric-loom' (non-remapping, unobfuscated 26.x).
	// Both are declared apply false; the right one is applied below based on -PmcTarget.
	id 'fabric-loom' version '1.17.19' apply false
	id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
	id 'maven-publish'
	id 'pmd'
	id 'checkstyle'
}

def envVersionFile = file("${rootDir}/.env.version")
def envVersionProps = new Properties()
envVersionFile.withInputStream { envVersionProps.load(it) }
ext.mod_version = envVersionProps.getProperty('MOD_VERSION')
if (ext.mod_version == null || ext.mod_version.isBlank()) {
	throw new GradleException("MOD_VERSION not found or empty in ${envVersionFile}")
}

def mcTargetForPlugins = (findProperty('mcTarget') ?: '1.21') as String
apply plugin: (mcTargetForPlugins == '26' ? 'net.fabricmc.fabric-loom' : 'fabric-loom')

pmd {
	consoleOutput = true
	toolVersion = "7.26.0"
	rulesMinimumPriority = 5
	ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
}

def configDir = "${project.rootDir}/config"
checkstyle {
	toolVersion = "13.10.0"
	configFile = file("$configDir/checkstyle/checkstyle.xml")
}

// The bstats/ dir is third-party code vendored with only its package line changed;
// bStats' terms forbid modifying it, and a lint rule is a modification. Excluded from
// both linters, never reformatted.
def bstatsVendored = 'pl/m2x/commandsspy/bstats/**'

checkstyleMain {
	source = fileTree('src/main/java').matching { exclude bstatsVendored } + fileTree('src/fabric/java') + fileTree('src/mc121/java') + fileTree('src/mc1192/java') + fileTree('src/mc114/java') + fileTree('src/mc26/java')
}

checkstyleTest {
	source ='src/test/java'
}

pmdMain {
	// Same reason as checkstyleMain above; PMD otherwise picks the dir up via sourceSets.main.
	source = source.matching { exclude bstatsVendored }
}

pmdTest {
	// Same categories as main, minus two unit-test style rules; see config/pmd/test-ruleset.xml.
	ruleSets = []
	ruleSetFiles = files("$configDir/pmd/test-ruleset.xml")
}

def mcTarget = mcTargetForPlugins
if (!(mcTarget in ['1.21', '1192', '114', '26'])) {
	throw new GradleException("Unknown -PmcTarget=${mcTarget}. Supported values: 1.21 (default), 1192, 114, 26")
}
def is26 = mcTarget == '26'
def is1192 = mcTarget == '1192'
def is114 = mcTarget == '114'

// One row per target, derived once. Everything below reads these instead of
// re-deciding, so adding a target is a change here, not a scavenger hunt.
def jarClassifier = is26 ? '26.x' : (is1192 ? '1.19-1.20.2' : (is114 ? '1.14.x' : '1.21.x'))
def propSuffix = is26 ? '26' : (is1192 ? '1192' : (is114 ? '114' : '121'))
def srcSetDir = is26 ? 'src/mc26/java' : (is1192 ? 'src/mc1192/java' : (is114 ? 'src/mc114/java' : 'src/mc121/java'))
// release 17/8/21 per target: era-correct bytecode. See the wiki, Supported-Versions.
def javaRelease = is1192 ? 17 : (is114 ? 8 : 21)

version = "${project.mod_version}+mc${jarClassifier}"
group = project.maven_group

// src/fabric/java holds the ModInitializer entrypoint — the only loader-API-touching
// class. It is a separate dir, not part of src/main/java, so the forge/ build can
// source-include src/main/java without dragging a Fabric dependency in.
sourceSets.main.java.srcDir('src/fabric/java')
sourceSets.main.java.srcDir(srcSetDir)

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	// To change the versions see the gradle.properties file
	if (is26) {
		minecraft "com.mojang:minecraft:${project.minecraft_version_26}"
		// No mappings dependency: Minecraft 26.x ships unobfuscated (real names baked in), so
		// there is nothing for Mojang to publish as mappings, and the non-remapping
		// 'net.fabricmc.fabric-loom' plugin applied above does not use a mappings dependency.
		implementation "net.fabricmc:fabric-loader:${project.loader_version_26}"
	} else {
		minecraft "com.mojang:minecraft:${project.getProperty("minecraft_version_${propSuffix}")}"
		mappings "net.fabricmc:yarn:${project.getProperty("yarn_mappings_${propSuffix}")}:v2"
		modImplementation "net.fabricmc:fabric-loader:${project.getProperty("loader_version_${propSuffix}")}"
	}

	// fabric-loader-junit boots a real FabricLoader; version must track the target's own loader version. See docs/testing.md.
	def loaderJunitVersion = project.getProperty("loader_version_${propSuffix}")
	testImplementation "net.fabricmc:fabric-loader-junit:${loaderJunitVersion}"

	// 1.16.5's log4j 2.8.1 lacks the Provider service file -> double-load CCE; modern core on TEST runtime only. See docs/testing.md.
	if (is114) {
		testRuntimeOnly "org.apache.logging.log4j:log4j-core:2.19.0"
	}
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.3"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
}

test {
	// fabric-loader-junit's FabricLoader bootstrap only engages on the JUnit Platform.
	useJUnitPlatform()
}

processResources {
	def modVersion = project.version
	def minecraftRange = project.getProperty("minecraft_range_${propSuffix}")
	def loaderRange = project.getProperty("loader_range_${propSuffix}")
	def javaRange = project.getProperty("java_range_${propSuffix}")
	def mixinCompat = project.getProperty("mixin_compat_${propSuffix}")
	def quiltLoaderRange = project.getProperty("quilt_loader_range_${propSuffix}")
	// quilt.mod.json's minecraft dependency needs a JSON array of individual
	// constraints ([">=1.20.3","<1.22"]); minecraftRange is one space-separated
	// string ">=1.20.3 <1.22" (Fabric's syntax). Reshape it once, here.
	def minecraftVersionsJson = groovy.json.JsonOutput.toJson(minecraftRange.trim().split(/\s+/) as List)
	inputs.property "version", modVersion
	inputs.property "minecraft_range", minecraftRange
	inputs.property "loader_range", loaderRange
	inputs.property "java_range", javaRange
	inputs.property "mixin_compat", mixinCompat
	inputs.property "quilt_loader_range", quiltLoaderRange

	filesMatching("fabric.mod.json") {
		expand "version": modVersion, "minecraft_range": minecraftRange,
				"loader_range": loaderRange, "java_range": javaRange
	}

	filesMatching("quilt.mod.json") {
		expand "version": modVersion, "quilt_loader_range": quiltLoaderRange,
				"minecraft_versions": minecraftVersionsJson, "java_range": javaRange
	}

	filesMatching("commandsspy.mixins.json") {
		expand "mixin_compat": mixinCompat
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
	// javac warns that release 8 itself is "obsolete" on modern JDKs; the warning is
	// about the release version, not about anything in this codebase, so silence it here.
	if (is114) {
		it.options.compilerArgs += ['-Xlint:-options']
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)

	toolchain {
		languageVersion = JavaLanguageVersion.of(is26 ? 25 : 21)
	}
}

jar {
	def archivesName = project.base.archivesName.get()
	from("LICENSE") {
		rename { "${it}_${archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}