org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties — 1.21.x target (yarn/intermediary; one jar covers all of 1.20.3–1.21.11).
# The range floor is 1.20.3 because that release flipped CommandManager.execute
# (class_2170.method_9249) from int-returning to void — this jar's hook shape. 1.20.3 and
# 1.20.4 still run on a Java 17 vanilla floor, but this jar is Java 21 bytecode, so their
# supported floor here is 21; Java-17 operators of those two versions are not served
# (the mc1192 jar cannot serve them either: its hook targets the int-returning descriptor).
minecraft_version_121=1.21.1
yarn_mappings_121=1.21.1+build.3
loader_version_121=0.16.5
minecraft_range_121=>=1.20.3 <1.22
loader_range_121=>=0.16.5
java_range_121=>=21
# Mixin compatibilityLevel, templated into commandsspy.mixins.json by
# processResources. It must not exceed the era's runtime JRE: JAVA_21 on a
# Java 17 JVM fails mixin bootstrap with "The requested compatibility level
# JAVA_21 could not be set". A future Java-8-era target would add JAVA_8 here.
mixin_compat_121=JAVA_21

# Fabric Properties — 26.x target (official Mojang names, unobfuscated; yarn does not exist for 26.x)
minecraft_version_26=26.2
loader_version_26=0.19.3
minecraft_range_26=>=26.1 <26.3
# Minecraft 26.x itself requires Java 25, and loader 0.19.3 is the verified line for
# unobfuscated 26.x; declaring these gives users a clear loader error instead of a vanilla crash.
loader_range_26=>=0.19.3
java_range_26=>=25
mixin_compat_26=JAVA_21

# Fabric Properties — 1.19–1.20.2 target (yarn/intermediary; one jar covers all of 1.19–1.20.2).
# Compile against 1.20.1: the most-run version in the range (the modpack-era anchor), and
# every version in >=1.19.1 <1.20.3 shares the identical int-returning hook descriptor
# with the ParseResults parameter. 1.19.0 is EXCLUDED: its execute() still takes
# (ServerCommandSource, String) — the ParseResults overload arrived in 1.19.1 — so this
# jar's mixin cannot apply there (e2e-disproven: InvalidInjectionException on 1.19.0)
# class_2170.method_9249 (Lcom/mojang/brigadier/ParseResults;Ljava/lang/String;)I, so any
# member of the range yields the same jar. 1.20.3 is where the return type became void
# (e2e-proven: this jar boot-fails on 1.20.3/1.20.4) — hence the exclusive <1.20.3 bound,
# mid-minor on purpose; from there the mc1.21.x jar takes over.
minecraft_version_1192=1.20.1
yarn_mappings_1192=1.20.1+build.10
loader_version_1192=0.16.5
minecraft_range_1192=>=1.19.1 <1.20.3
# Same loader floor as the 1.21.x target; verified booting on loader 0.19.3 in e2e.
loader_range_1192=>=0.16.5
# Era-correct guard (2026-08-17 addendum): this jar is Java 17 bytecode
# (options.release = 17), so operators frozen on Minecraft's own Java 17 floor
# for these versions are first-class supported users.
java_range_1192=>=17
# JAVA_17, not JAVA_21: these servers run on Java 17 JVMs, where a JAVA_21
# mixin compatibility level is rejected at bootstrap.
mixin_compat_1192=JAVA_17

# Fabric Properties — 1.14–1.18.x target (yarn/intermediary; one jar covers all of 1.14.4–1.18.2).
# Compiled against 1.16.5 — the mid-point of the range and its primary audience. The intercept
# point (intermediary class_2170.method_9249, descriptor (Lclass_2168;Ljava/lang/String;)I: the
# source arrives directly, no ParseResults wrapper, int return) and every member the hook touches
# (class_2168.method_9214/.method_9228, class_1297.method_5477, class_3222) are intermediary-
# identical across 1.14.4–1.18.2, so the compile-against version inside the range does not change
# the output. 1.19 gained the ParseResults parameter — hence the exclusive <1.19 bound; from
# there the mc1.19-1.20.2 jar takes over.
minecraft_version_114=1.16.5
yarn_mappings_114=1.16.5+build.10
loader_version_114=0.19.3
minecraft_range_114=>=1.14 <1.19
# Deliberately a HIGH loader floor, not an era-contemporary one: loader 0.19.3 is the line the
# back-compat study verified to serve working server launchers all the way down to 1.14.4, and
# it is what the e2e harness boots. Do not lower this.
loader_range_114=>=0.19.3
# Era-correct guard (2026-08-17 addendum): this jar is Java 8 bytecode
# (options.release = 8), so operators frozen on Minecraft's own Java 8 floor
# for 1.14–1.16.5 are first-class supported users. 1.17.1 (floor 16) and
# 1.18.2 (floor 17) are admitted by the same >=8 guard.
java_range_114=>=8
# JAVA_8, not JAVA_21: these servers run on Java 8 JVMs, where a higher mixin
# compatibility level is rejected at bootstrap.
mixin_compat_114=JAVA_8

# Mod Properties
maven_group=m2x.commandsspy
archives_base_name=commandsspy
