org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Floor 1.20.3: that release flipped execute() to void. See docs/version-matrix.md.
minecraft_version_121=1.21.1
yarn_mappings_121=1.21.1+build.3
loader_version_121=0.16.5
minecraft_range_121=>=1.20.3 <1.22
loader_range_121=>=0.16.5
# Quilt Loader natively loads this jar's fabric.mod.json; quilt.mod.json exists
# only for an honest Quilt platform badge. Floor verified by the e2e matrix's
# Quilt jobs, not assumed. Do not diverge per era without re-verifying.
quilt_loader_range_121=>=0.30.0
java_range_121=>=21
# Templated into commandsspy.mixins.json; must not exceed the era's runtime JRE.
mixin_compat_121=JAVA_21

# Fabric Properties — 26.x target (official Mojang names, unobfuscated; yarn does not exist for 26.x)
minecraft_version_26=26.2
loader_version_26=0.19.3
minecraft_range_26=>=26.1 <26.3
# Minecraft 26.x itself requires Java 25, and loader 0.19.3 is the verified line for
# unobfuscated 26.x; declaring these gives users a clear loader error instead of a vanilla crash.
loader_range_26=>=0.19.3
quilt_loader_range_26=>=0.30.0
java_range_26=>=25
mixin_compat_26=JAVA_21

# 1.19–1.20.2 target. Floor 1.19.1 (ParseResults overload), ceiling <1.20.3
# (execute() became void). See docs/version-matrix.md.
minecraft_version_1192=1.20.1
yarn_mappings_1192=1.20.1+build.10
loader_version_1192=0.16.5
minecraft_range_1192=>=1.19.1 <1.20.3
# Same loader floor as the 1.21.x target; verified booting on loader 0.19.3 in e2e.
loader_range_1192=>=0.16.5
quilt_loader_range_1192=>=0.30.0
# Java 17 bytecode: era-correct guard.
java_range_1192=>=17
# JAVA_17, not JAVA_21: these servers run on Java 17 JVMs, where a JAVA_21
# mixin compatibility level is rejected at bootstrap.
mixin_compat_1192=JAVA_17

# 1.14–1.18.x target, compiled against 1.16.5; every touched intermediary member
# is identical across the range. See docs/version-matrix.md.
minecraft_version_114=1.16.5
yarn_mappings_114=1.16.5+build.10
loader_version_114=0.19.3
minecraft_range_114=>=1.14 <1.19
# Deliberately a HIGH loader floor, not an era-contemporary one: loader 0.19.3 is the line the
# back-compat study verified to serve working server launchers all the way down to 1.14.4, and
# it is what the e2e harness boots. Do not lower this.
loader_range_114=>=0.19.3
quilt_loader_range_114=>=0.30.0
# Java 8 bytecode: era-correct guard.
java_range_114=>=8
# JAVA_8, not JAVA_21: these servers run on Java 8 JVMs, where a higher mixin
# compatibility level is rejected at bootstrap.
mixin_compat_114=JAVA_8

maven_group=m2x.commandsspy
archives_base_name=commandsspy
