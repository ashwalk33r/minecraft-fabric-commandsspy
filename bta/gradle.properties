# BTA target — "Better than Adventure!", a fork of Minecraft Beta 1.7.3 with its own
# fabric-loader fork. See docs/bta-toolchain-spike.md for what was resolved and booted.

# The BTA release this build compiles against: the newest, so the seam is checked
# against the head of the platform. The jar runs on every version in minecraft_range_bta.
bta_version=8.0.1

# Enumerated, never an interval. BTA's version strings ("7.3_01") are not semver, so a
# `>=7.3` predicate would be parsed as a StringVersion and refuse most of the list; and
# an open interval would claim BTA releases that no CI leg ever booted. Adopting a new
# BTA release is a deliberate four-place edit — see the wiki, Supported-Versions -> BTA.
minecraft_range_bta=["7.3","7.3_01","7.3_02","7.3_03","7.3_04","8.0","8.0.1"]

# BTA's loader fork. NOT upstream fabric-loader and NOT the babric fork: it is the only
# loader that loads an unobfuscated BTA jar with no intermediary namespace.
loader_version_bta=0.18.4-bta.11
loader_range_bta=>=0.18.4-bta.11

# Java 17, not 21. The loader fork sets Mixin compatibility to JAVA_17 itself (measured
# in the boot log) and BTA's own docs point users at OpenJDK 17, so 17 is the floor the
# runtime imposes. Declaring 21 would refuse the JVM the platform recommends.
java_range_bta=>=17
mixin_compat_bta=JAVA_17

# BTA's Loom line, published on the Signalum maven.
loom_version_bta=1.15-SNAPSHOT

# The version metadata Loom reads to resolve the BTA game jar. Per-release URL.
bta_manifest_url_bta=https://downloads.betterthanadventure.net/bta-client/release/v8.0.1/manifest.json
