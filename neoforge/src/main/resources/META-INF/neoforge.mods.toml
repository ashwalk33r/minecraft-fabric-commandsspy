# The MODERN metadata file, read by FML 3.x and later — Minecraft 1.20.5 up.
# Its sibling META-INF/mods.toml carries the same values for FML 1.x/2.x, which
# read that filename instead and reject the `type` key below. Keep both in step.
#
# Templated by neoforge/build.gradle's processResources, the same way
# fabric.mod.json and quilt.mod.json are by the root build.
#
# modLoader/loaderVersion are BOTH mandatory, despite being widely documented as
# optional: omitting modLoader makes FML reject the jar outright with
# "InvalidModFileException: Missing ModLoader in file" and crash the server at
# pre-load. e2e-proven on NeoForge 21.1.248 — do not "simplify" them away.
#
# loaderVersion is the FML version, a THIRD version axis distinct from both the
# NeoForge and Minecraft versions: FML 1.x ships with NeoForge 20.2.x, 4.x with
# 21.1.x, 11.x with 26.2.x. Hence the per-band fml_range_* properties.
modLoader = "javafml"
loaderVersion = "${fml_range}"
license = "MIT"
issueTrackerURL = "https://github.com/ashwalk33r/minecraft-fabric-commandsspy/issues"

[[mods]]
modId = "commandsspy"
version = "${version}"
displayName = "Commands Spy"
description = '''Log commands to server console.'''
authors = "Ultra_MC"

# The band's measured span. NeoForge has shipped Mojang official names since
# 20.2 and has no SRG era, so the range is bounded by what booted, not by the
# mappings. Every edge in it has a row in the boot table; see the wiki,
# Version-Boundaries-And-Root-Causes -> "Hard floors".
[[dependencies.commandsspy]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.commandsspy]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
