# ModDevGradle runs the NeoForm pipeline (decompile + recompile Minecraft) on
# the first build of each line; -Xmx1G (the root build's value) is not enough.
# This file is why neoforge/ is a standalone build: the root build keeps its
# own smaller heap.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# NeoForge publishes ONE version line per Minecraft version, each built against
# that version's Mojmaps — there is no Intermediary-style stable mapping to ride.
# So, unlike the Fabric jars, a NeoForge jar covers exactly one Minecraft
# version and the ranges below are deliberately narrow. See docs/version-matrix.md.

# 21.1.x line -> Minecraft 1.21.1 (the modpack-dominant line).
neoforge_version_121=21.1.248
minecraft_version_121=1.21.1
neoforge_range_121=[21.1,21.2)
# FML version, a third axis: NeoForge 21.1.248 reports --fml.fmlVersion 4.0.43.
fml_range_121=[4,)
minecraft_range_121=[1.21.1]
java_range_121=>=21

# 26.2.x line -> Minecraft 26.2. Note the FOUR-component version: the 26.2 line
# numbers as 26.2.0.<n>, not 26.2.<n>.
neoforge_version_26=26.2.0.64
minecraft_version_26=26.2
neoforge_range_26=[26.2,26.3)
# NeoForge 26.2.0.64 resolves net.neoforged.fancymodloader:loader:11.0.16.
fml_range_26=[11,)
minecraft_range_26=[26.2]
java_range_26=>=25
