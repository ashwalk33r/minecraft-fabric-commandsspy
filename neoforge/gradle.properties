# ModDevGradle runs the NeoForm pipeline (decompile + recompile Minecraft) on
# the first build of each line; -Xmx1G (the root build's value) is not enough.
# This file is why neoforge/ is a standalone build: the root build keeps its
# own smaller heap.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Band rows: one row per jar. NeoForge has shipped Mojang official names since
# 20.2 and has no SRG era, so a jar is not pinned to one Minecraft version by its
# code — only by the metadata this build writes. The anchor is the newest STABLE
# patch of the OLDEST line the band can be BUILT against: bytecode binds only
# downward, so compile down and run up. Measured boot table:
# docs/version-matrix.md.
#
# 20.4.251 rather than 20.2.93, which would be the band's true floor line:
# ModDevGradle 2.x resolves net.neoforged:neoforge with the
# `neoforge-moddev-bundle` capability, and the 20.2/20.3 lines predate it
# ("Unable to find a variant ... with the requested capability"). 20.4.251 is
# the oldest line that publishes it, and it is still a Java-17 line, which is
# what the band's floor actually needs — CommandEvent and NeoForge.EVENT_BUS are
# byte-identical on 20.2.93 and 20.4.251, so the anchor choice costs no API.
#
# Range keys are namespaced minecraft_range_neo_* on purpose: tools/gen_matrix.go
# keys the fabric t0 band off minecraft_range_121 in the ROOT gradle.properties.

# Band `all` -> Minecraft 1.20.2-26.2, the whole NeoForge history.
neoforge_version_all=20.4.251
minecraft_version_all=1.20.2-26.2
neoforge_range_all=[20.2,)
fml_range_all=[1,)
minecraft_range_neo_all=[1.20.2,26.3)
java_release_all=17

# 21.1.x line -> Minecraft 1.21.1 (the modpack-dominant line).
neoforge_version_121=21.1.248
minecraft_version_121=1.21.1
neoforge_range_121=[21.1,21.2)
# FML version, a third axis: NeoForge 21.1.248 reports --fml.fmlVersion 4.0.43.
fml_range_121=[4,)
minecraft_range_neo_121=[1.21.1]
java_range_121=>=21
java_release_121=21

# 26.2.x line -> Minecraft 26.2. Note the FOUR-component version: the 26.2 line
# numbers as 26.2.0.<n>, not 26.2.<n>.
neoforge_version_26=26.2.0.64
minecraft_version_26=26.2
neoforge_range_26=[26.2,26.3)
# NeoForge 26.2.0.64 resolves net.neoforged.fancymodloader:loader:11.0.16.
fml_range_26=[11,)
minecraft_range_neo_26=[26.2]
java_range_26=>=25
java_release_26=25
